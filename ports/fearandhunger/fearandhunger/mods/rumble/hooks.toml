# rumble: la consola (o el telefono) vibra en los momentos fuertes de la
# partida. Cada funcion de RPG Maker MV con el archivo del mod que la envuelve
# (runtime/game/hooks/hooks.h, hooks_load_mods). Ver README.md.
[hooks]
"BattleManager.setup"                    = "rumble"   # empieza una batalla
"Game_Actor.prototype.performDamage"     = "rumble"   # te hacen dano
"Game_Actor.prototype.performCollapse"   = "rumble"   # cae alguien del grupo
"Game_Actor.prototype.performMapDamage"  = "rumble"   # dano en el mapa (veneno, sangrado)
