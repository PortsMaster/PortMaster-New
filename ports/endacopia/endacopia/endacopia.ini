[config]
deadzone_mode = scaled_radial
deadzone = 4000
deadzone_scale = 18
deadzone_triggers = 3000
mouse_delay = 16
mouse_slow_scale = 50

[controls]
up = "w"
down = "s"
left = "a"
right = "d"

left_analog_up = "w"
left_analog_down = "s"
left_analog_left = "a"
left_analog_right = "d"

right_analog = mouse_movement

a = "mouse_left"
b = "mouse_right"

l1 = mouse_slow
l2 = "mouse_left"
r1 = "mouse_left"
r2 = "mouse_right"

x = "space"
y = "backspace"

start = "esc"
back = "f12"
