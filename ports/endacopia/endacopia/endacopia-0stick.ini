[config]
deadzone_scale = 18
deadzone_triggers = 3000
mouse_delay = 16

[controls]
up = "w"
down = "s"
left = "a"
right = "d"

a = hold_state pointer

l1 = "mouse_left"
r1 = "mouse_right"

b = "esc"
x = "space"
y = "backspace"

start = "space"
back = "f12"

[controls:pointer]
overlay = parent
dpad = mouse_movement
