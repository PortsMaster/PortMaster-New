[config]
deadzone_mode = axial
deadzone = 3000
deadzone_scale = 7
deadzone_delay = 16

[controls]

a = enter

l1 = h        # system reboot menu
r1 = g        # Cameras
l2 = e         # Play Audio
r2 = f       # Switch to vent cams

#Pan Office and play minigames
left_analog_up = w
left_analog_down = s
left_analog_left = a 
left_analog_right = d 

x = x       # seal vents

# Mute call - Step 3/6
y = m

# Camera navigation Arrow Keys
up = up
down = down
left = left
right = right
