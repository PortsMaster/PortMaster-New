# gptokeyb2 mapping for Torus Trooper.
# The game reads the keyboard: arrows steer and accelerate, Z fires, X charges
# a shot (released on key up), P pauses, Esc returns to the title and quits
# from the title. PortMaster handhelds use the Nintendo diamond: a = east,
# b = south.

[config]
deadzone_triggers = 3000
deadzone_mode = axial
deadzone = 2000
deadzone_scale = 8
mouse_delay = 16

[controls]
a = "z"
b = "x"

start = "p"
back = "esc"

up = "up"
down = "down"
left = "left"
right = "right"

left_analog = arrow_keys
