# mkxp-z reads the gamepad natively through SDL_GameControllerOpen, so no button
# is remapped here. gptokeyb2 runs only to provide the Start+Select exit hotkey.
# Every binding is left blank on purpose: binding anything would send a second,
# synthetic keyboard event alongside the one the engine already handles itself.

[config]
deadzone_triggers = 3000
deadzone_mode = axial
deadzone = 2000
deadzone_scale = 8
mouse_delay = 16

[controls]
a =
b =
x =
y =

l1 =
l2 =
l3 =
r1 =
r2 =
r3 =

start =
back =

up =
down =
left =
right =

left_analog =
right_analog =
