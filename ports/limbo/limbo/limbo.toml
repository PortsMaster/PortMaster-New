[paths]

# assets/ and lib/ sit next to the binary, same layout as the Layton port.
game_files="./"
support_files="./"

android_package_code="/fakepath_package_code"
android_external_files="/fakepath_external_files"
android_files="/fakepath_files"
android_obb_dirs=["/fakepath_obb"]
android_source_dirs=["/fakepath_source"]
android_cache="cache/"

# Reported as ApplicationInfo.nativeLibraryDir. Limbo reads it to locate native
# libraries sitting next to its own binary; relative to game_files.
android_native_lib_dir="lib/arm64-v8a/"


[package]

packageName="com.playdead.limbo"
versionName="1.20"
mainIntentBundle = {}


[device]

# Reported to the game as the ANativeWindow size, so it should match the
# panel: the engine sizes its render target from this (and scales it by 0.8 --
# 1920x1080 here gives its "Render window w/h = 1536/864"), then presents into
# the real window. Leaving this at 1280x720 on a 1920x1080 panel drew the game
# into only part of the screen even though the window itself was fullscreen.
displayWidth=1920
displayHeight=1080
displayRotation=0
fullscreen=true

# AConfiguration_getTouchscreen: 1 = NOTOUCH, 2 = STYLUS, 3 = FINGER.
# This MUST be 3 -- Limbo's front end is touch-driven, and a game told there is
# no touchscreen can disable that input path outright.
displayTouchscreen=3

# AConfiguration_getOrientation: 1 = PORT, 2 = LAND. Note that thunks/ndk/ndk.cpp
# reads this from displayRotation, which laytonloader instead uses as a rotation
# in degrees -- the same key means different things to the two loaders. Limbo
# does no rotation, so it is safe to use it as the orientation enum here.
#displayRotation=2
#displayDensity=160
language="en"
country="US"


[video]

# Emulated vsync rate fed to native_ReportVSyncCallEvent (see the frame loop
# in projects/limboloader/main.cpp).
#
# The engine signals its render thread on every OTHER report at a normal
# <=20ms cadence, and measures real elapsed time per rendered frame (it has
# no fixed 1/30s timestep constant), so the rendered frame rate is exactly
# half the report rate:
#   120 -> 60 FPS at 1x speed (default)
#    60 -> 30 FPS at 1x speed
# If gameplay ever measures fast at 120 (audio/gameplay running too quickly),
# drop this to 60.
vsync_hz=60


[input]

# Gamepad support. Limbo takes input through the native AInputQueue rather than
# JNI, so limboloader translates SDL controller events itself (see
# projects/limboloader/main.cpp) -- this flag is read by
# platform/common/input_backend.cpp, which limboloader does not use.
controller=true
touch_mode=false
accurate_mode=false
