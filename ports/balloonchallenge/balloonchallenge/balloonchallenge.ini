[config]
repeat_delay = 250
repeat_rate = 100
deadzone_x = 10000
deadzone_y = 10000

[controls]
a = "space"
b = "c"
x = "d"
y = "n"

l1 = "y"
r1 = "n"
l2 = "h"
r2 = "g"

start = "q"
back = "o"

up = "t"
down = "e"
left = "left" repeat
right = "right" repeat

left_analog_left = "left" repeat
left_analog_right = "right" repeat
