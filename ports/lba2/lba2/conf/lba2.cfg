; Gamepad (SDL3 positional mapping; 0 = unbound)
; Virtual scancodes start at K_GAMEPAD_BASE = 1024 (see KEYBOARD_KEYS.H).
; No enable flag: if a controller is connected, it works.
GamepadDeadzone: 8000

; Movement scheme. On here: the stick or D-pad points where you want to go, as
; you see it on screen, indoors and out. It reads the four direction inputs, so
; it applies to whichever of them a device has. Options -> Controls ->
; "Movement: classic turn" switches back to 1997 tank control (left/right turn
; on the spot), live, at any time.
;
; It is independent of Auto camera below, deliberately. Auto camera re-renders
; the terrain every frame the hero moves, which costs roughly 15 ms/frame on
; this class of hardware -- about 52 fps against 235 with it off -- so the two
; are kept separate rather than one dragging in the other.
FollowCamera: 0
CameraRelativeMove: 1
CameraRelativeTurnSpeed: 2560

