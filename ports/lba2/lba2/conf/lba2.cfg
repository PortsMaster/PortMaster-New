; L.B.A.2 Configuration file
;
; The engine's own default config, with the pad laid out for handhelds. Stock,
; turning is on the left stick alone, so a device without one cannot steer at
; all. Here movement is on the D-pad (the stick stays as a second binding where
; a device has one), which is what the 1997 keyboard layout was. That frees the
; two triggers, which stock used for forward/back: L2 now snaps the camera 90
; degrees and R2 dodges, both of which were otherwise stick-only and so
; unreachable. It costs the four D-pad item shortcuts (Gamepad32-35); the
; penguin, Proto-Pack, protection and lightning are all still in the inventory.
; Rebind any of it in Options -> Controls -> Gamepad.
;
; These same values are the build's compiled-in defaults (GamepadKeysDefault in
; SOURCES/INPUT.CPP), so "restore defaults" on that screen returns here rather
; than to upstream's stick-only layout, which a stickless device cannot steer
; back out of.

