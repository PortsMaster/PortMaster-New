# gptokeyb2 for Cassette Beasts: the handheld's controls become keys, so the handheld is always the game's keyboard
# player (player 1) and every real pad is a co-op pad. The keys write no text (name fields) and are free in the game:
# the port binds each one to the actions of the pad button in the same position (PortOptions.gd), so the game's
# Switch prompts show the printed letters. On Knulli the launcher swaps a/b and x/y back to the printed letters

[config]
deadzone = 8000

[controls]
a = "f7"
b = "f5"
x = "f10"
y = "f8"
l1 = "f12"
l2 = "f12"
r1 = "insert"
r2 = "insert"
back = "alt"
start = "enter"

up = "up"
down = "down"
left = "left"
right = "right"

left_analog_up = "up"
left_analog_down = "down"
left_analog_left = "left"
left_analog_right = "right"
