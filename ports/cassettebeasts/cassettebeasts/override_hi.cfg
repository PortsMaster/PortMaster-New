
; Snapdragon handhelds (Adreno GPU): appended to override.cfg by the launcher, later values win. The 3D at full
; screen resolution with the game's own effects (glow, depth of field, shadows, anti-aliasing) available again.
[rendering]

quality/3d_render_scale=1.0
viewports/max_3d_pixels=0
quality/directional_shadow/size=2048
quality/directional_shadow/size.mobile=2048
quality/shadow_atlas/size=2048
quality/shadow_atlas/size.mobile=2048
quality/filters/msaa=2
quality/depth/hdr=true
quality/depth/hdr.mobile=true
quality/intended_usage/framebuffer_allocation=2
viewports/force_no_hdr=false
viewports/force_no_3d_effects=false
viewports/force_no_msaa=false

; the warp tunnel and the cutscene fractal background at full resolution (the other devices draw them at half, PortOptions.gd)
[port]

vortex_lines=0
