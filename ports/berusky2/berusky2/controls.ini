[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
overlay = clear

a = mouse_left
b = mouse_right
x = mouse_slow
y = tab

l1 = leftshift
r1 = leftctrl
l2 = f12
r2 = hold_state camera
l3 = space
r3 = h

start = esc
back = f1

up = up
down = down
left = left
right = right

left_analog = mouse_movement
right_analog_up = pageup
right_analog_down = pagedown
right_analog_left = home
right_analog_right = end

[controls:camera]
overlay = parent

up = "="
down = "-"
left = x
right = v
y = c
a = f2
b = f3
x = r
l1 = o
r1 = n
l3 = f11
r3 = f12
start = l
back = t

[controls:dpad_mouse]
overlay = parent

dpad = mouse_movement
