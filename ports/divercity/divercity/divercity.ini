[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
a = mouse_left
b = mouse_right
x = mouse_slow
y = "m"

l1 = "-"
r1 = "numpad+"
l2 = "1"
r2 = "3"

start = hold_state hk_start
back = "esc"
r3 = "p"

up = "up"
down = "down"
left = "left"
right = "right"

left_analog = mouse_movement

right_analog_up = "up"
right_analog_down = "down"
right_analog_left = "left"
right_analog_right = "right"

[controls:hk_start]
overlay = parent
down = push_state text_input

[controls:text_input]
overlay = clear
charset = basic

up = prev_letter
down = next_letter
l1 = prev_letter10
r1 = next_letter10

right = add_letter
left = remove_letter
a = add_letter
b = remove_letter

start = finish_text
back = cancel_text
