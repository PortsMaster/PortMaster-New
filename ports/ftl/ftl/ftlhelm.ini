# ftlhelm layout: https://github.com/mxmgorin/ftlhelm/blob/main/docs/CONFIGURATION.md
# Deleting this file resets it to the defaults.

[config]
layout_version = 7
cursor_speed = 800
cursor_deadzone = 0.25
cursor_curve = 2

snap_dpad = 1
flick_threshold = 0.7
focus_repeat = 2
focus_cone_narrow = 30
focus_cone_wide = 60
focus_side_weight = 2
focus_first = 1
crew_follow = 0
room_crew_pick = 1

wheels_ship_only = 1
wheel_place = center
wheel_backdrop = octagon
autopause = 1
speed_level = 6

tap_hold = 0.2
rumble = 1
rumble_time = 0.05
swap_buttons = 1
cancel_pause = 1

badge = 1
focus_brackets = 1
crew_marker = 1
pointer_size = 1
zoom = 0
hud_shift = 1
ipad_beacons = 1
ipad_station_buttons = 1
text_scale = 0
help_at_start = 1
frame_filter = 3

touch = 1
touch_long_press = 0.5
touch_slop = 6
touch_snap = 32
touch_step = 16
pause_button = 1
touch_marks = 1

fps_log = 0

[controls]
overlay = clear

a = context_click
b = wheel abilities | cancel
x = wheel weapons | arm_next
y = wheel crew | aim_crew
l1 = wheel systems | prev_tab
r1 = wheel ship | next_tab
l2 = precision | room_doors
r2 = fast_forward | j
l3 = center_swap
r3 = center_swap
start = pause
back = wheel settings

left_analog = flick
right_analog = flick

[wheel:weapons]
kind = power
up = arm_all "All weapons"
up_right = 1 "Weapon 1"
right = 2 "Weapon 2"
down_right = 3 "Weapon 3"
down = 4 "Weapon 4"
down_left = 5 "Drone 1"
left = 6 "Drone 2"
up_left = 7 "Drone 3"

[wheel:systems]
kind = systems

[wheel:crew]
kind = crew

[wheel:ship]
kind = action
up = center_swap "Other ship"
up_right = x "Close doors" systemUI/button_door_top_on.png@10,13,20,15
right = z "Open doors" systemUI/button_door_bottom_on.png@10,35,20,15
down_right = y "Artillery" icons/s_artillery_overlay.png
down = v "Autofire"
down_left = q "All crew" upgradeUI/Equipment/tabButtons/equipment_crew_on.png@49,12,29,29
left = / "Save stations" statusUI/button_station_assign_on.png@1,1,18,18
up_left = enter "To stations" statusUI/button_station_return_on.png@1,1,18,18

[wheel:settings]
kind = settings
up = dpad_mode "Mouse"
up_right = zoom "Zoom"
right = wheel controls "Controls"
down_right = set speed_level "Fast speed"
down = help "Help"
down_left = autopause "Autopause"
left = wheel view "View"
up_left = text_size "Text"

[wheel:view]
kind = settings
up = set badge "Badge"
up_right = set crew_marker "Crew marker"
right = set hud_shift "HUD shift"
down_right = set ipad_beacons "iPad beacons"
down = set ipad_station_buttons "iPad buttons" statusUI/button_station_assign_on.png@1,1,18,18
down_left = set pointer_size "Pointer size"
left = set frame_filter "Frame filter"
up_left = set focus_brackets "Focus brackets"

[wheel:controls]
kind = settings
up = set focus_repeat "Repeat"
up_right = set flick_threshold "Stick"
right = set room_crew_pick "Room crew"
down_right = set swap_buttons "Swap buttons"
down = set touch "Touch"
down_left = set cancel_pause "B pause"
left = set rumble "Rumble"
up_left = set tap_hold "Hold time"

[wheel:abilities]
kind = action
up = repeat_ability "Repeat ability"
up_right = n "Hacking" icons/s_hacking_overlay.png
right = m "Mind control" icons/s_mind_overlay.png
down_right = t "Teleport" systemUI/button_teleport_top_on.png@11,12,18,16
down = p "Lockdown" icons/locking/s_lock.png
down_left = r "Teleport back" systemUI/button_teleport_bottom_on.png@11,34,18,17
left = b "Battery" icons/s_battery_overlay.png
up_left = c "Cloak" icons/s_cloaking_overlay.png
