[config]
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000
mouse_delay = 16

[controls]
a = "mouse_left"            # Select / activate
b = "mouse_right"           # Deselect
x = mouse_slow              # Hold to slow the cursor

l1 = "-"                    # Volume down
r1 = "="                    # Volume up

start = p                   # Pause
back = esc                  # Main menu / quit from main menu

left_analog = mouse_movement
dpad = mouse_movement
