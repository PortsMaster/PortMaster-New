# Sin and Punishment Recompiled - Handheld Configuration

[video]
# Aspect ratio: "expand" (widescreen full screen) or "original" (4:3 pillarboxed)
aspect_ratio = "expand"
# Resolution scale: 0 (Native window), 1 (240p), 2 (480p), 3 (720p), 4 (960p), or 5 (1200p)
resolution_scale = 0
vsync = true
target_fps = 60
sharp_textures = false
sharp_hud = true

[audio]
master_volume = 100
music_volume = 100
sfx_volume = 100

[controls]
# Scheme:
#   "auto"                 - Auto-detect: Twin Stick if 2+ sticks, else Stickless: Strafe + Shift
#   "dpad_strafe_shift"    - Stickless: Strafe + Shift: D-Pad strafes, Hold L1/L2 + D-Pad aims (X recenters/switches), A fire, B jump, Y roll
#   "bumper_strafe"        - Stickless: Bumper Strafe: D-Pad aims, L1/R1 strafe, A/R2 fire, B jump, X/L2 lock-on
#   "face_strafe"          - Stickless: Face Strafe: D-Pad aims, Y/B strafe, A roll, R1/R2 fire, L1/X jump, L2 lock-on
#   "dpad_aim"             - Legacy: D-Pad Aim: D-Pad aims, Y/A strafe, R1/R2 fire, L1 jump, B/L2 roll, X lock-on
#   "dpad_strafe"          - Legacy: Face Aim: D-Pad strafes, Face diamond (X/B/Y/A) aims, R1 fire, L1 jump, L2 roll, R2 lock-on
#   "twin_stick"           - Twin Stick: Left stick strafes, Right stick aims, R1/A fire, L1/B jump, L2/Y roll, R2/X lock-on
#   "twin_stick_swapped"   - Twin Stick: Left stick aims, Right stick strafes, R1/A fire, L1/B jump, L2/Y roll, R2/X lock-on
scheme = "auto"
# Smart Lock-On: "auto" ("auto" = Off/N64 Toggle on stick devices, Auto/Hold=Manual on stickless devices; "off", "hold", "always")
smart_lock_on = "auto"
# Aim Curve: "s_curve" (fine tap precision + smooth ramp), "linear"
aim_curve = "s_curve"
# Face button layout: "nintendo" (East A, South B, North X, West Y) or "positional" (swapped A<->B, X<->Y)
face_layout = "nintendo"
stick_sensitivity = 100.0
deadzone = 0.15
analog_aim = true
rumble = true
swap_sticks = false

[cheats]
unlock_options = false
infinite_health = false
infinite_time = false
infinite_continues = false
max_score = false
invincible = false
infinite_air_jumps = false

[rom]
# Preferred ROM region: "auto" (prefers English if present, else Japanese), "en", or "jp"
preferred_region = "auto"

[retroachievements]
# Softcore RetroAchievements with automatic NextUI (minuisettings.txt) & RetroArch (retroarch.cfg) import
enabled = true
import_system_credentials = true
notifications = true
username = ""
token = ""
