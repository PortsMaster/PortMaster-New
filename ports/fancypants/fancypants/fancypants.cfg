# Fancy Pants Adventures port settings (sourced by the launch script)

# Ruffle render quality: low (fastest, no anti-aliasing), medium, high
FPA_QUALITY="low"

# World 1 to 3 screen fit (they are 3:2):
#   extend = (default) fills the screen; on 4:3 and square screens the game shows more of
#            the level above and below, on 16:9 more to the sides
#   fit    = the original 3:2 view, centered with black bars at the top and bottom
#   fill   = fills the screen with the 3:2 view, trimming the sides (cuts off the HUD on 4:3)
# World 4 (the hub) always uses the full screen.
FPA_ASPECT="extend"

# Frame rate of Worlds 1 and 2: 30 (default) keeps the game speed steady on handhelds,
# 60 is smoother but only for devices that can hold a full 60 fps (World 3 always runs at 30)
FPA_WORLD_FPS="30"
