[config]
deadzone_x = 10000
deadzone_y = 10000

[controls]
a = "enter"         # Talk / confirm
b = "leftctrl"      # Use power
x = "i"             # Item selection
y = "leftalt"       # Use item

l1 = "p"            # Power selection
r1 = "o"            # Companion orders
l2 = "pagedown"     # Volume down
r2 = "pageup"       # Volume up

start = "esc"       # Options / save menu, skip intro
back = "l"          # Log

up = "up"
down = "down"
left = "left"
right = "right"

left_analog_up = "up"
left_analog_down = "down"
left_analog_left = "left"
left_analog_right = "right"
