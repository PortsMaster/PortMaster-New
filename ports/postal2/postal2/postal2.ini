[config]
mouse_slow_scale = 30
deadzone_mode = axial
deadzone_scale = 6
deadzone = 1000
deadzone_triggers = 3000
mouse_delay = 16

[controls]
mouse_wheel_amount = 1

start = "esc"
back = "numpad2"

b = "space"
a = "enter"
y = "c"
x = "r"

l1 = "h"
r1 = "q"
l2 = mouse_right
r2 = mouse_left

l3 = "shift"
r3 = "t"

right_analog = mouse_movement

left_analog_up = "w"
left_analog_left = "a"
left_analog_down = "s"
left_analog_right = "d"

up = mouse_wheel_up repeat
down = mouse_wheel_down repeat
left = "[" repeat
right = "]" repeat

guide = hold_state text_input

[controls:text_input]
charset = extended
start = pop_state
up = prev_letter
down = next_letter
right = add_letter
left = "backspace"
a = "enter"
b = "backspace"
