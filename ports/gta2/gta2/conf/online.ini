# GTA2 online (gta2-online): the names and rooms the lobby offers (comma-separated;
# the browser's lobby can join the same rooms by name), then the game servers.
[net]
# the server connected last (its name, from the [server] sections below)
server = Coolgeek (PL)
names = Ace, Rusty, Nina, Zed, Kasia, Moose, Lola, Duke
name = Ace
rooms = ROOM1, ROOM2, ROOM3, ROOM4, ROOM5, ROOM6
room = ROOM1
crews = Reds, Blues, Greens
# the crew joined last, joined again on entering a room (as the browser does)
crew =
# in a match: Select + up, down, left, right sends one of these
chat_up = Follow me!
chat_down = Wait for me!
chat_left = Help!
chat_right = Nice one!
# show the other players' chat messages and waypoints (also in Options)
show_chat = 1
show_waypoints = 1

# One [server] section per game server, in the lobby's order. url: ws:// or wss://
# (TLS). password: optional, the lobby asks for it (and keeps it here); or the code of
# an invite link (?invite=...). wss:// checks the certificate against the console's
# authorities; for a certificate of the server's own: ca_file (its authority, a PEM
# file in conf/ unless absolute) or tls_fingerprint (sha256:..., the log shows it).

[server]
name = Coolgeek (PL)
url = wss://gta2-pl.coolgeek.ca
password = PorkMaster
invite =
ca_file =
tls_fingerprint =

[server]
name = Coolgeek (CA)
url = wss://gta2-ca.coolgeek.ca
password = PorkMaster
invite =
ca_file =
tls_fingerprint =
