[config]
deadzone_mode = axial
deadzone_scale = 6

[controls]
up = up
down = down
left = left
right = right

left_analog_up = up
left_analog_down = down
left_analog_left = left
left_analog_right = right

right_analog = mouse_movement

a = enter
b = esc
x = n                        # View next move in game history
y = p                        # View previous move in game history

l1 = r                       # Retract move
r1 = mouse_left               # Click, for use with the right stick as a pointer
