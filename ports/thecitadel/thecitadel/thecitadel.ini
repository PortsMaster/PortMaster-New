# The Citadel
[config]
deadzone_mode = scaled_radial
deadzone = 12000
deadzone_scale = 6
mouse_delay = 16

[controls]
a = home
b = f
x = f
y = f
l1 = leftctrl
r1 = leftshift
l2 = leftctrl
r2 = leftshift
start = p
back = esc
l3 = f11
r3 = f12
up = pageup
down = pagedown
left = q
right = e
left_analog_up = w
left_analog_down = s
left_analog_left = a
left_analog_right = d
right_analog = mouse_movement
