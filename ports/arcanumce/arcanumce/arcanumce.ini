[config]
repeat_delay = 16
mouse_delay = 16
repeat_rate = 60
mouse_slow_scale = 40
deadzone_mode = scaled_radial
deadzone_scale = 12
deadzone_x = 2000
deadzone_y = 2000
deadzone_triggers = 3000

[controls]
a = "mouse_left"
b = "mouse_right"
x = mouse_slow
y = "c"

l1 = push_state hotkeys
l2 = "f12"
r1 = "w"
r2 = "k"

start = "enter"
back = "esc"

up = "up"
down = "down"
left = "left"
right = "right"

left_analog = mouse_movement

[controls:hotkeys]
overlay = parent

l1 = pop_state

up = "1"
down = "3"
left = "4"
right = "2"
