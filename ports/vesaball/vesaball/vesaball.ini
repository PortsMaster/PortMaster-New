[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 13
deadzone_x = 2000
deadzone_y = 2000

[controls]
a = mouse_left              # Launch ball / select / editor: paint
b = mouse_right             # Editor: erase
x = mouse_slow              # Hold to slow the stick cursor
y = "s"                     # Editor: save level

l1 = "pageup"               # Editor: previous level
r1 = "pagedown"             # Editor: next level
l2 = "l"                    # Editor: reload level
r2 = "c"                    # Editor: clear board

start = "p"                 # Pause
back = "esc"                # Back / quit from main menu

left_analog = mouse_movement

up = "up"
down = "down"
left = "left"
right = "right"
