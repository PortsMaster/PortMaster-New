[paths]

# assets/ and lib/ sit directly in the port folder, and the launch script
# already cd's here, so the loader stays put.
game_files="./"
support_files="./"

android_package_code="/fakepath_package_code"
android_external_files="/fakepath_external_files"
android_files="/fakepath_files"
android_obb_dirs=["/fakepath_obb"]
android_source_dirs=["/fakepath_source"]
android_cache="cache/"


[package]

packageName="com.Level5.LT1R"
versionName="1.0.8"
mainIntentBundle = {}


[device]

# Ignored while fullscreen -- the real drawable size is queried from SDL.
displayWidth=1280
displayHeight=720
fullscreen=true

# Orientation of the game view:
#   0        landscape -- fills the panel as-is
#   90 / 270 portrait  -- the DS layout (two screens stacked) rendered portrait
#                         and rotated onto a widescreen panel; use 270 if 90 is
#                         upside down for how you hold the device
#   180      landscape, flipped
# L1 / R1 rotate this while playing, so no need to edit anything to try them.
displayRotation=0


[input]

# Pointer speed for the stick and d-pad. The base speed already scales with
# the display, so this is only for taste.
cursorSpeed=0.75

