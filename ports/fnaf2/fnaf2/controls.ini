[config]
deadzone_mode = axial
deadzone = 3000
deadzone_scale = 7
deadzone_delay = 16

[controls]

overlay = controls

# Custom Night READY / general confirm
start = enter

# Camera monitor open/close, mask on/off
r2 = g          # Camera monitor
l2 = h          # Mask

# Lights (held)
l1 = i          # Left light
r1 = j          # Right light

# Office pan (held) + minigames
left_analog_up = w
left_analog_down = s
left_analog_left = a 
left_analog_right = d 

a = ctrl        # Flashlight
x = e           # Music box (held, cam 11 only)

# Mute call
y = m

# Custom Night preset mode cycle
right_analog_left = z
right_analog_right = c

# Camera navigation (monitor open) / Custom Night slider select+adjust
up = up
down = down
left = left
right = right
