[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
a = mouse_left
b = mouse_right
x = mouse_slow
y = "enter"

l1 = "tab"
l2 = "f12" set_state osk
r1 = "backspace"
r2 =

start = "enter"
back = "esc"
guide =

dpad = mouse_movement

left_analog = mouse_movement
right_analog =

[controls:osk]
overlay = controls
l2 = "f12" set_state controls
dpad = arrow_keys
