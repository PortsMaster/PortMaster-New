# Configuration for berusky game

# Game data location
level_data = ./Levels
game_data = ./GameData
graphics_data = ./Graphics

# Graphics settings for game
fullscreen = 1
color_depth = 32
disable_double_size = 1
startup_doublesize_question = 0

# Logging
log = 0
logfile = ~/.berusky/b1logfile.txt

# Game binary & tmp dir
# they're used by editor for "run level" command
game_binary = ./berusky.aarch64
tmp_data = /tmp

# Dir for users levels (it's the default level dir for level editor)
level_data_user = ~/.berusky/User
