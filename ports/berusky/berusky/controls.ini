[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
overlay = clear

a = mouse_left
b = esc
x = mouse_slow
y = tab

l1 = f2
r1 = f3
l2 = shift
r2 = r add_ctrl

start = f1
back = esc

up = up
down = down
left = left
right = right

left_analog = mouse_movement

[controls:dpad_mouse]
overlay = parent

dpad = mouse_movement
