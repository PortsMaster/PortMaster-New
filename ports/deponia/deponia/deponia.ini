[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
a = "mouse_left"
b = "mouse_right"
x = mouse_slow
y = "space"

l1 = "mouse_wheel_up"
r1 = "mouse_wheel_down"

start = "esc"
back = "esc"

dpad = mouse_movement
left_analog = mouse_movement
