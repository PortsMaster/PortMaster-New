# gptokeyb2 mapping for In Your Face City Trains (keyboard only): Space jumps,
# Enter starts / confirms, Up/Down pick the difficulty, R restarts, P pauses,
# Esc goes back, M mutes.
# PortMaster handhelds use the Nintendo diamond: a = east, b = south,
# x = north, y = west.

[config]
deadzone_triggers = 3000

[controls]
a = "enter"
b = "space"
x = "r"
y = "esc"

l1 = "m"
start = "p"

up = "up"
down = "down"
left = "left"
right = "right"

left_analog = arrow_keys
right_analog =
