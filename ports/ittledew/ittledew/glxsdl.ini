# Settings for libglxsdl.so (GLX on the firmware's SDL2). Read once at game start: "key = value", # for comments.

# The only joystick the game may open. gptokeyb2 -x makes this virtual Xbox 360 pad from the handheld's controller,
# with the same layout on every device; the real controller stays hidden from the game, so no press arrives twice.
# Remove the line to let the game open every joystick.
pad = Microsoft X-Box 360 pad

# Setup re-encodes every DXT5 texture as ASTC under its DXT5 label (the game only knows DXT): 1 = upload them as ASTC
# (decoded on the CPU if the GPU has no ASTC). 0 would treat them as real DXT5.
dxt5_astc = 1
