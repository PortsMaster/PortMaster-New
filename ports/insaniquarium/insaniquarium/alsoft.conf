# openal-soft: a larger audio buffer than the default.
#
# The default is 3 periods of 882 frames, about 60 ms. On a low-end handheld
# that drains as soon as the game hitches, and ALSA reports it as
# "mmap commit error: Broken pipe", which is heard as a break in the music.
#
# 8 periods of 1024 frames is about 186 ms: still low latency for a pointer
# game, and enough to ride out a stumble.
[general]
period_size = 1024
periods = 8
